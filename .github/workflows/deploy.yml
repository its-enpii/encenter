name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script: |
            cd /home/enpii/studio/encenter
            git pull origin main
            docker network inspect web-network >/dev/null 2>&1 || docker network create web-network
            rm -rf website/frontend/.next
            docker compose stop encenter-frontend envault-worker
            docker compose build encenter-frontend
            docker compose up -d --no-deps encenter-frontend envault-backend envault-worker envault-nginx
            docker compose exec -T envault-backend rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php
            docker compose exec -T envault-backend php artisan package:discover --ansi
            docker compose exec -T envault-backend php artisan config:clear
            docker compose exec -T envault-backend php artisan cache:clear
            docker compose exec -T envault-backend php artisan route:clear
            docker compose exec -T envault-backend php artisan view:clear
            docker compose exec -T envault-backend php artisan migrate --force
            docker compose restart envault-worker envault-nginx
