name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/enpii/studio/encenter
            git pull origin main
            docker network inspect web-network >/dev/null 2>&1 || docker network create web-network
            docker compose down encenter-frontend
            docker volume rm -f encenter_frontend-next-cache encenter_frontend-node-modules || true
            docker compose build --no-cache encenter-frontend
            docker compose up -d --force-recreate
            docker compose restart envault-nginx
            docker compose exec -T envault-backend rm -f bootstrap/cache/packages.php bootstrap/cache/services.php
            docker compose exec -T envault-backend php artisan package:discover --ansi
            docker compose exec -T envault-backend php artisan config:clear
            docker compose exec -T envault-backend php artisan cache:clear
            docker compose exec -T envault-backend php artisan migrate --force
