services:
  envault-backend:
    build: ./website/backend
    container_name: envault-backend
    restart: unless-stopped
    volumes:
      - ./website/backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      - postgres
    networks:
      - agent-network
      - web-network

  envault-worker:
    build: ./website/backend
    container_name: envault-worker
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=0
    volumes:
      - ./website/backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      - envault-backend
      - postgres
    networks:
      - agent-network

  envault-nginx:
    image: nginx:alpine
    container_name: envault-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./website/backend:/var/www/html
      - ./website/backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - envault-backend
    networks:
      - agent-network
      - web-network

  encenter-frontend:
    build:
      context: ./website/frontend
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: encenter-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./website/frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_PMA_URL=${NEXT_PUBLIC_PMA_URL}
    networks:
      - agent-network
      - web-network

  openclaw:
    build: ./openclaw
    container_name: encenter-openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - PI_AI_ANTIGRAVITY_VERSION=1.25.0
      - OPENCLAW_GATEWAY_BIND=lan
    volumes:
      - ./openclaw/config:/root/.openclaw
      - ./openclaw/workspace:/root/.openclaw/workspace
    networks:
      - agent-network
      - web-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: encenter-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - ./n8n/data:/home/node/.n8n
    networks:
      - agent-network
      - web-network

  postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - ./evolution/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - agent-network
      - web-network

  redis:
    image: redis:7
    container_name: evolution-redis
    restart: unless-stopped
    networks:
      - agent-network
      - web-network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: encenter-evolution
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - N8N_ENABLED=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
    volumes:
      - ./evolution/instances:/evolution/instances
    networks:
      - agent-network
      - web-network

  phpmyadmin:
    build: ./phpmyadmin
    container_name: encenter-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_BLOWFISH_SECRET=${PMA_BLOWFISH_SECRET}
    volumes:
      - ./phpmyadmin:/var/www/html
    networks:
      - agent-network
      - web-network


volumes:
  backend-vendor:
  frontend-node-modules:
  frontend-next-cache:

networks:
  agent-network:
    driver: bridge
    name: agent-network
  web-network:
    external: true
